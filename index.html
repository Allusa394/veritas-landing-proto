<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERITAS — юридическая фирма</title>
<meta name="description" content="Демо-лендинг юридической фирмы: направления практики, стоимость консультаций, команда юристов, форма заявки. Нужен такой же лендинг под вашу нишу — пишите.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a1120'/%3E%3Cpath d='M16 6v20M9 12l-4 6h8l-4-6zm14 0l-4 6h8l-4-6zM7 18a2 2 0 0 0 4 0M25 18a2 2 0 0 0 4 0M9 8h14' stroke='%23c9a227' stroke-width='1.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a1120;
    --bg-alt: #0e1830;
    --surface: #131f36;
    --surface-2: #17253f;
    --border: rgba(255,255,255,0.08);
    --gold: #c9a227;
    --gold-bright: #e0bc4a;
    --gold-soft: rgba(201,162,39,0.14);
    --text: #f2f4f8;
    --text-dim: #9aa7bc;
    --text-faint: #6b7890;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; overflow-x: hidden; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;
  }

  h1, h2, h3 {
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  a { color: inherit; text-decoration: none; }

  img { max-width: 100%; display: block; }

  :focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  .container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 32px;
  }

  .eyebrow {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 15px 30px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .btn-gold {
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    color: #16130a;
  }

  .btn-gold:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(201,162,39,0.3);
  }

  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-outline:hover {
    border-color: var(--gold);
  }

  section {
    padding: 96px 0;
  }

  .section-head {
    margin-bottom: 48px;
  }

  .section-head h2 {
    font-size: clamp(28px, 3.4vw, 38px);
    margin-bottom: 10px;
  }

  .section-head p {
    color: var(--text-dim);
    font-size: 17px;
  }

  /* Placeholder — секции добавляются по одной */
</style>
</head>
<body>

</body>
</html>
